name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The one check to require on the default branch, and in the merge queue.
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Kickoff: install the project's toolchain and dependencies here, pinned.
      # A pull request gets the fast level; the queue and the default branch get everything.
      - run: node scripts/verify.mjs ${{ github.event_name != 'pull_request' && '--full' || '' }}
