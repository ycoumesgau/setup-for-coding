name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The same command a session runs before a push: CI confirms, it does not discover.
      - run: node scripts/verify.mjs
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
