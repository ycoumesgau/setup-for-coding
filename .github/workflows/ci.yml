name: CI

# A pull request is where a change is verified. Nothing runs after the merge.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # A named image, not a moving label: the day "latest" changes, every job changes with it.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The same command a session runs before a push: CI confirms, it does not discover.
      - run: node scripts/verify.mjs
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
