name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push replaces the run of an older one on a pull request only: on the default
# branch and in a merge queue every commit keeps its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    # A named image, not a moving label: the day "latest" changes, every job changes with it.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The same command a session runs before a push: CI confirms, it does not discover.
      - run: node scripts/verify.mjs
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
